name: Build Community with ubuntu-24

on:
  push:
    paths-ignore:
      - "doc/**"
      - "*.md"
      - ".vscode/**"
      - ".devcontainer/**"
      - ".gitignore"
      - ".gitattributes"
      - ".gitmodules"
      - ".clang-format"
      - "translations.sh"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build-${{ matrix.label }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: phase3b-baseline
            ref: c4ac3dc0a62c1be0b584d251bb8d6cfb0078e6d4
          - label: candidate
            ref: ${{ github.sha }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: frepple
          POSTGRES_PASSWORD: frepple
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checking out source code
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Set up Nodes
        uses: actions/setup-node@v6

      - name: Install packages
        run: |
          sudo apt update
          sudo apt install --no-upgrade libxerces-c-dev openssl libssl-dev libpq5 libpq-dev postgresql-client python3 python3-dev python3-venv python3-setuptools
          sudo npm -g install pnpm@latest-10
          pnpm install --frozen-lockfile

      - name: Build wheel from committed checkout
        if: matrix.label == 'candidate'
        run: |
          test -z "$(git status --porcelain)"
          wheel_venv="${RUNNER_TEMP}/mlcc-wheel-venv"
          wheel_dir="${RUNNER_TEMP}/mlcc-wheel-${GITHUB_SHA}"
          python3 -m venv "${wheel_venv}"
          "${wheel_venv}/bin/python" -m pip install --upgrade pip setuptools wheel
          mkdir -p "${wheel_dir}"
          "${wheel_venv}/bin/python" -m pip wheel . --no-deps --no-build-isolation --wheel-dir "${wheel_dir}"
          "${wheel_venv}/bin/python" -m pip list
          sha256sum "${wheel_dir}"/*.whl

      - name: Upload wheel
        if: matrix.label == 'candidate'
        uses: actions/upload-artifact@v6
        with:
          name: mlcc-candidate-wheel-${{ github.sha }}
          path: ${{runner.temp}}/mlcc-wheel-${{github.sha}}/*.whl
          if-no-files-found: error

      - name: Build
        run: |
          echo "GIT_COMMIT=$(git rev-parse HEAD)"
          cat /etc/os-release
          python3 --version
          g++ --version
          cmake --version
          pg_config --version
          psql --version
          git submodule sync --recursive
          git submodule update --init --recursive --checkout
          echo "MAIN_REPOSITORY_SHA=$(git rev-parse HEAD)"
          git submodule status --recursive
          if git submodule status --recursive | grep -Eq '^[+-U]'; then
            echo "A submodule isn't checked out at the SHA locked by the main repository"
            exit 1
          fi
          grunt
          cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Release
          cmake --build ${{github.workspace}}/build --config Release --target package -- -j 4
          cmake --build ${{github.workspace}}/build --config Release --target doc
          . ${{github.workspace}}/venv/bin/activate
          python -c "import django, sys; print('Python', sys.version); print('Django', django.get_version())"
          if [ "${{ matrix.label }}" = "candidate" ]; then
            python -c "import ortools; print('OR-Tools', ortools.__version__)"
          fi
          echo "PATH=$PATH" >> $GITHUB_ENV
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> $GITHUB_ENV

      - name: Rehearse PostgreSQL fresh install and phase-1 upgrade
        if: matrix.label == 'candidate'
        working-directory: ${{github.workspace}}
        run: |
          export POSTGRES_HOST=localhost
          export POSTGRES_PORT=5432
          export POSTGRES_DBNAME=mlccgate
          export FREPPLE_DATE_STYLE="day-month-year"

          # Path A: a clean PostgreSQL database migrates directly to the latest schema.
          python frepplectl.py createdatabase --noinput
          python frepplectl.py migrate
          python frepplectl.py migrate --plan | tee /tmp/mlcc-fresh-plan.txt
          grep -q "No planned migration operations" /tmp/mlcc-fresh-plan.txt

          # Path B: load the real phase-1 demo at f7f538c, then upgrade through
          # all MLCC migrations added after phase 1.
          phase1_checkout="${RUNNER_TEMP}/frepple-phase1-upgrade"
          git worktree add --detach "${phase1_checkout}" f7f538cef7eaa404480e1f385feb9f89067c44d6
          pushd "${phase1_checkout}"
          export DJANGO_SETTINGS_MODULE=freppledb.settings
          python -c "from pathlib import Path; import freppledb; assert Path(freppledb.__file__).resolve().is_relative_to(Path.cwd().resolve())"
          python -m django createdatabase --noinput
          python -m django migrate
          python -m django load_mlcc_demo
          python -m django shell -c "from freppledb.mlcc.models import MlccRecipe; assert MlccRecipe.objects.filter(source='mlcc_demo').exists()"
          popd
          python frepplectl.py migrate mlcc
          python frepplectl.py shell -c "from django.db import connection; from freppledb.mlcc.models import MlccRecipe; assert MlccRecipe.objects.filter(source='mlcc_demo').exists(); assert {'mlcc_precheck_run', 'mlcc_precheck_issue', 'mlcc_load_unit_conversion'}.issubset(set(connection.introspection.table_names())); columns={c.name for c in connection.introspection.get_table_description(connection.cursor(), 'operationplan')}; assert {'mlcc_load_quantity', 'mlcc_load_unit'}.issubset(columns)"

          # Path C: the upgraded database is idempotent.
          python frepplectl.py migrate --plan | tee /tmp/mlcc-upgraded-plan.txt
          grep -q "No planned migration operations" /tmp/mlcc-upgraded-plan.txt
          git worktree remove --force "${phase1_checkout}"

      - name: Test
        working-directory: ${{github.workspace}}
        run: |
          export POSTGRES_HOST=localhost
          export POSTGRES_PORT=5432
          export FREPPLE_DATE_STYLE="day-month-year"
          mkdir -p logs
          python frepplectl.py check
          python frepplectl.py makemigrations --check --dry-run mlcc
          python test/runtest.py
          python frepplectl.py test freppledb --verbosity=2

      - name: Test uninstalling apps
        working-directory: ${{github.workspace}}
        run: |
          export POSTGRES_HOST=localhost
          export POSTGRES_PORT=5432
          python frepplectl.py createdatabase --noinput
          python frepplectl.py migrate
          python frepplectl.py migrate forecast zero
          python frepplectl.py migrate wizard zero
          python frepplectl.py migrate metrics zero
          python frepplectl.py migrate reportmanager zero
          python frepplectl.py migrate executesql zero

      - name: "Keep logs"
        uses: actions/upload-artifact@v6
        if: ${{ failure() }}
        with:
          name: test_logs
          path: logs
          retention-days: 1

      - name: Verify reproducible controlled checkout
        if: matrix.label == 'candidate'
        run: |
          echo "Tracked differences after build and tests:"
          git diff --name-status
          git diff --cached --name-status
          git diff --exit-code
          git diff --cached --exit-code

          # Build outputs must stay in ignored build/venv/log directories or in
          # RUNNER_TEMP. Any other untracked path is unexpected and fails CI.
          unexpected="$(git ls-files --others --exclude-standard)"
          if [ -n "${unexpected}" ]; then
            echo "Unexpected untracked files:"
            printf '%s\n' "${unexpected}"
            exit 1
          fi
          test -z "$(git status --porcelain)"

      - name: Upload official release files
        if: matrix.label == 'candidate' && startsWith(github.ref, 'refs/tags/') && github.repository == 'frePPLe/frepple'
        uses: actions/upload-artifact@v6
        with:
          name: community-release-${{ github.sha }}
          path: |
            ${{github.workspace}}/build/contrib/docker/*.deb
            ${{github.workspace}}/build/frepple-doc-*.tgz
          if-no-files-found: error

      - name: Send failure mail
        if: failure()
        uses: dawidd6/action-send-mail@v16
        with:
          connection_url: ${{secrets.MAIL_CONNECTION}}
          secure: false
          subject: "Github action failure: Failure Community Edition"
          from: '"frepple devops" <devops@frepple.com>'
          to: '"frepple devops" <devops@frepple.com>'
          body: |
            Please check the logs at https://github.com/frePPLe/frepple/actions/runs/${{ github.run_id }}
          html_body: |
            <p>Please check <a href="https://github.com/frePPLe/frepple/actions/runs/${{ github.run_id }}">the logs</a>.</p>

  # Build the runtime image natively on each architecture and push it under an
  # architecture-specific tag. A native arm64 runner avoids QEMU emulation,
  # keeping the arm64 build as fast as the amd64 one. The `merge` job then
  # stitches the two into a single multi-arch manifest.
  #
  # The image name is taken from the tag the build produces, so these jobs
  # work unchanged for the enterprise edition once
  # `frePPLe/frepple-enterprise-dev` is added to the `if:` guards below.
  docker:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'frePPLe/frepple'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - name: Checking out source code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Nodes
        uses: actions/setup-node@v6

      - name: Install packages
        run: |
          sudo apt update
          sudo apt install --no-upgrade libxerces-c-dev openssl libssl-dev libpq5 libpq-dev postgresql-client python3 python3-dev python3-venv python3-setuptools
          sudo npm -g install pnpm@latest-10
          pnpm install --frozen-lockfile

      - name: Build the docker image
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --checkout
          echo "MAIN_REPOSITORY_SHA=$(git rev-parse HEAD)"
          git submodule status --recursive
          if git submodule status --recursive | grep -Eq '^[+-U]'; then
            echo "A submodule isn't checked out at the SHA locked by the main repository"
            exit 1
          fi
          grunt
          cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Release
          cmake --build ${{github.workspace}}/build --config Release --target docker

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push architecture-specific image
        id: push
        run: |
          version=${GITHUB_REF#refs/tags/}
          arch=${{ matrix.platform }}
          arch=${arch#linux/}
          # Image name (frepple-community / frepple-enterprise) is taken from
          # the tag the cmake `docker` target produced -- no edition hardcoded.
          image=$(docker image ls --format '{{.Repository}}' | grep -m1 -E '/frepple-(community|enterprise)$')
          docker tag "$image:$version" "$image:$version-$arch"
          docker push "$image:$version-$arch"
          echo "image=$image" >> "$GITHUB_OUTPUT"

  # Stitch the per-architecture images into one multi-arch manifest list,
  # published as the :<version> and :latest tags.
  merge:
    needs: [build, docker]
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'frePPLe/frepple'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push the multi-arch manifest
        run: |
          version=${GITHUB_REF#refs/tags/}
          image=${{ needs.docker.outputs.image }}
          docker buildx imagetools create \
            --tag "$image:$version" \
            --tag "$image:latest" \
            "$image:$version-amd64" \
            "$image:$version-arm64"
          docker buildx imagetools inspect "$image:$version"

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'frePPLe/frepple'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download official release files
        uses: actions/download-artifact@v6
        with:
          name: community-release-${{ github.sha }}
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }} Community Edition"
          body: |
            Release notes are available on https://frepple.com/docs/current/release-notes.html

            **docker container**\: Docker pull ghcr.io/frepple/frepple:${{ github.ref_name }}
            **ubuntu24-frepple-${{ github.ref_name }}.deb**\: Installer for Ubuntu 24.04 LTS
            **frepple-doc-${{ github.ref_name }}.tgz**\: Documentation
          files: release-assets/*
          make_latest: ${{ endsWith(github.ref, '.0') }}
